<style>
/* Visual design follows the WF-PST program stylesheet. */
:root{
  color-scheme:light;
  --brand:#00629b; --brand-dark:#003b5c; --ink:#1a2531; --muted:#5b6b7b;
  --line:#e4e9ef; --bg:#f6f8fb; --card:#fff; --page:#eef2f6;
  --keynote:#b8860b; --panel:#0d8a8a; --workshop:#2e8b57; --tutorial:#c2601a;
  --dac:#5b53b5; --co:#0f7ea8; --cn:#a13d82; --cps:#c0392b; --joint:#6b7a1f;
  --social:#9a5b2e; --special:#5a6b82; --break:#8896a6;
}
*{box-sizing:border-box}
body{background:var(--page);color:var(--ink);margin:0;padding:24px 16px 40px;
  font-family:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;line-height:1.5}
h1,h2,h3,h4,p{margin:0}
.program{background:var(--bg);border-radius:14px;overflow:clip;max-width:1240px;margin:0 auto;box-shadow:0 1px 3px rgba(15,40,70,.08)}

.hero{background:linear-gradient(135deg,var(--brand-dark),var(--brand) 70%);color:#fff;padding:40px 20px 34px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-80px;top:-80px;width:300px;height:300px;background:radial-gradient(circle,rgba(255,255,255,.12),transparent 70%);border-radius:50%}
.eyebrow{letter-spacing:.14em;text-transform:uppercase;font-size:.82rem;font-weight:600;opacity:.9;max-width:60ch}
.hero h1{font-size:2.55rem;line-height:1.14;margin:10px 0 8px;font-weight:700;max-width:none;text-wrap:balance}
.hmeta{display:flex;flex-wrap:wrap;gap:10px 26px;margin-top:16px;font-size:1.12rem}
.draft{position:absolute;right:20px;top:18px;z-index:1;font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;border:1px dashed rgba(255,255,255,.6);padding:4px 8px;border-radius:6px}

.legend{display:flex;flex-wrap:wrap;gap:10px 18px;padding:16px 20px 12px}
.chip{display:inline-flex;align-items:center;gap:8px;font-size:.95rem;color:var(--muted)}
.dot{width:13px;height:13px;border-radius:3px;flex:none}

nav.days{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:rgba(246,248,251,.94);backdrop-filter:blur(8px);
  border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:10px 20px;display:flex;gap:8px;overflow-x:auto}
nav.days button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:11px 20px;border-radius:10px;
  font-size:1.05rem;font-weight:600;cursor:pointer;white-space:nowrap;display:flex;flex-direction:column;align-items:flex-start;line-height:1.2;transition:.15s}
nav.days button small{font-weight:500;color:var(--muted);font-size:.82rem}
nav.days button:hover{border-color:var(--brand)}
nav.days button:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
nav.days button.glance{margin-left:auto;border-color:var(--brand-dark);color:var(--brand-dark)}
nav.days button[aria-selected="true"]{background:var(--brand);color:#fff;border-color:var(--brand)}
nav.days button.glance[aria-selected="true"]{background:var(--brand-dark);border-color:var(--brand-dark)}
nav.days button[aria-selected="true"] small{color:rgba(255,255,255,.85)}

.view{padding:24px 20px 54px}
.dhead{margin-bottom:16px}
.dhead h2{font-size:1.4rem;font-weight:700}
.dhead p{color:var(--muted);font-size:.92rem;margin-top:2px}

.slot{display:grid;grid-template-columns:92px 1fr;gap:16px;padding:10px 0;border-top:1px solid var(--line)}
.dhead + .slot{border-top:none}
.time{font-weight:700;color:var(--brand-dark);font-size:.9rem;padding-top:12px;font-variant-numeric:tabular-nums}
.time small{display:block;font-weight:500;color:var(--muted);font-size:.72rem}
.ss{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));align-items:start}
.ss.one{grid-template-columns:1fr}

.sx{--k:var(--special);background:var(--card);border:1px solid var(--line);border-left:7px solid var(--k);border-radius:10px;padding:12px 15px;min-width:0}
.sx .kind{font-size:.82rem;letter-spacing:.05em;text-transform:uppercase;font-weight:700;color:var(--k)}
.sx .room{float:right;margin-left:8px;font-size:.74rem;color:var(--muted);font-weight:600;background:var(--bg);border:1px solid var(--line);padding:2px 9px;border-radius:20px}
.sx h3{font-size:1.02rem;font-weight:650;margin:5px 0 2px;line-height:1.3}
.sx .who{font-size:.95rem;color:var(--muted)}
.sx .who b{color:var(--ink);font-weight:600}
.sx .meta{font-size:.9rem;color:var(--muted);margin-top:5px}
.sx.k-break,.gi.k-break{background:#fbfcfe}
.sx.tbd{border-left-style:dashed;background:repeating-linear-gradient(135deg,#fff,#fff 10px,#fafbfd 10px,#fafbfd 20px)}

.papers{margin-top:10px;border-top:1px solid var(--line);padding-top:6px}
.papers h4{font-size:.78rem;letter-spacing:.05em;text-transform:uppercase;color:var(--k);margin:8px 0 2px}
.pp{display:grid;grid-template-columns:1fr;gap:2px;padding:7px 0}
.pp + .pp{border-top:1px dashed var(--line)}
.pid{font-size:.72rem;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.ptitle{font-size:.92rem;font-weight:600;line-height:1.35}
.pauth{font-size:.84rem;color:var(--muted)}
.chair{font-size:.9rem;color:var(--muted);margin:4px 0 2px}

.ggrid{display:grid;grid-template-columns:repeat(var(--cols,3),minmax(0,1fr));gap:14px}
.gcol{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.gcol h3{background:var(--brand);color:#fff;font-size:.92rem;padding:10px 12px;font-weight:650}
.gcol h3 small{display:block;font-weight:500;opacity:.85;font-size:.72rem}
.gi{--k:var(--special);padding:8px 12px;border-top:1px solid var(--line);border-left:6px solid var(--k)}
.gi .gt{font-size:.72rem;font-weight:700;color:var(--brand-dark);font-variant-numeric:tabular-nums}
.gi .gk{font-size:.7rem;letter-spacing:.04em;text-transform:uppercase;font-weight:700;color:var(--k)}
.gi .gh{font-size:.82rem;line-height:1.3;margin-top:1px}
.gi .gw{font-size:.75rem;color:var(--muted);margin-top:1px}
.gi.par{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px;border-left-color:var(--line)}
.gi.par>div{min-width:0;border-left:4px solid var(--k);padding-left:7px}
.gi.par .gt{grid-column:1/-1}

.k-keynote{--k:var(--keynote)} .k-panel{--k:var(--panel)} .k-workshop{--k:var(--workshop)} .k-tutorial{--k:var(--tutorial)}
.k-dac{--k:var(--dac)} .k-co{--k:var(--co)} .k-cn{--k:var(--cn)} .k-cps{--k:var(--cps)} .k-joint{--k:var(--joint)}
.k-social{--k:var(--social)} .k-special{--k:var(--special)} .k-break{--k:var(--break)}

.program > footer{border-top:1px solid var(--line);padding:20px;color:var(--muted);font-size:.8rem;text-align:center}
@media(max-width:820px){.ggrid{grid-template-columns:1fr}}
@media(max-width:560px){
  .hero h1{font-size:1.75rem}
  .draft{position:static;display:inline-block;margin-bottom:12px}
  .slot{grid-template-columns:64px 1fr;gap:10px}
  .time{font-size:.8rem}
}
@media (prefers-reduced-motion:reduce){nav.days button{transition:none}}
</style>
</head>

const KINDS = {keynote:"Keynote", panel:"Panel", workshop:"Workshop", tutorial:"Tutorial",
  dac:"Data Analytics & Computation", co:"Control & Operation", cn:"Communications & Networking",
  cps:"Cyber-Physical Security & Privacy", joint:"Joint Session", social:"Networking", special:"Program / Special", break:"Break"};
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const $ = id => document.getElementById(id);
const t12 = t => { const [h, m] = t.split(":").map(Number); return `${h % 12 || 12}:${String(m).padStart(2,"0")} ${h < 12 ? "AM" : "PM"}`; };

$("eyebrow").textContent = CONF.eyebrow;
$("conf-name").textContent = CONF.name;
$("hmeta").innerHTML = CONF.meta.map(m => `<span>${m}</span>`).join("");
$("foot").textContent = CONF.footer;
$("legend").innerHTML = Object.entries(KINDS).map(([k,v]) =>
  `<span class="chip"><i class="dot" style="background:var(--${k})"></i>${v}</span>`).join("");

function papers(groups){
  if (!groups || !groups.length) return "";
  const many = groups.length > 1;
  return `<div class="papers">${groups.map(g => `${many && g.title ? `<h4>${esc(g.title)}</h4>` : ""}${g.papers.map(([id, ti, au]) =>
    `<div class="pp"><div class="pid">${esc(id)}</div><div class="ptitle">${esc(ti)}</div><div class="pauth">${esc(au)}</div></div>`).join("")}`).join("")}</div>`;
}
function card(i){
  const people = (i.people||[]).map(([r,n,a]) => `<div class="who">${r==="Affiliation" ? `<b>${esc(n)}</b>` : `${esc(r)}: <b>${esc(n)}</b>${a?` (${esc(a)})`:""}`}</div>`).join("");
  return `<div class="sx k-${i.kind}${i.tbd?" tbd":""}">${i.room?`<span class="room">${esc(i.room)}</span>`:""}`+
    `<span class="kind">${esc(i.label || KINDS[i.kind])}</span><h3>${esc(i.title)}</h3>${people}`+
    `${i.chair?`<div class="chair">${esc(i.chair)}</div>`:""}${i.meta?`<div class="meta">${esc(i.meta)}</div>`:""}${papers(i.groups)}</div>`;
}
function gItem(i){
  const k = i.gk || i.label || KINDS[i.kind];
  return `<div class="gk">${esc(k)}${i.room && i.kind!=="break" && !/Pre-Function/.test(i.room) ? ` · ${esc(i.room)}` : ""}</div><div class="gh">${esc(i.glance || i.title)}</div>`;
}

let views = "", tabs = "";
DAYS.forEach((d, n) => {
  const id = "day" + (n+1);
  tabs += `<button role="tab" id="t-${id}" aria-controls="${id}" data-v="${id}">${esc(d.tab)}<small>${esc(d.short)}</small></button>`;
  views += `<section class="view" role="tabpanel" id="${id}" aria-labelledby="t-${id}" hidden>
    <div class="dhead"><h2>${esc(d.title)}</h2><p>${esc(d.sub)}</p></div>
    ${d.slots.map(s => `<div class="slot"><div class="time">${t12(s.start)}<small>to ${t12(s.end)}${s.note?` · ${esc(s.note)}`:""}</small></div>
      <div class="ss${s.items.length===1?" one":""}">${s.items.map(card).join("")}</div></div>`).join("")}</section>`;
});
const gDays = CONF.glanceDays.map(n => DAYS[n]).filter(Boolean);
tabs += `<button role="tab" class="glance" id="t-glance" aria-controls="glance" data-v="glance">▤ At-a-Glance<small>presentation days</small></button>`;
views += `<section class="view" role="tabpanel" id="glance" aria-labelledby="t-glance" hidden>
  <div class="dhead"><h2>Program at a Glance</h2><p>${esc(CONF.glanceNote)}</p></div>
  <div class="ggrid" style="--cols:${gDays.length}">${gDays.map(d => `<div class="gcol"><h3>${esc(d.tab)}<small>${esc(d.short)}</small></h3>
    ${d.slots.map(s => s.items.length > 1
      ? `<div class="gi par"><div class="gt">${t12(s.start)}–${t12(s.end)}</div>${s.items.map(i => `<div class="k-${i.kind}">${gItem(i)}</div>`).join("")}</div>`
      : `<div class="gi k-${s.items[0].kind}"><div class="gt">${t12(s.start)}</div>${gItem(s.items[0])}</div>`).join("")}
  </div>`).join("")}</div></section>`;
$("tabs").innerHTML = tabs;
$("views").innerHTML = views;

function show(v){
  document.querySelectorAll("nav.days button").forEach(b => b.setAttribute("aria-selected", b.dataset.v === v));
  document.querySelectorAll(".view").forEach(p => p.hidden = p.id !== v);
  try { localStorage.setItem("program-view", v); } catch(e){}
}
$("tabs").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  show(b.dataset.v);
  const nav = $("tabs"); if (nav.getBoundingClientRect().top <= 1) nav.scrollIntoView();
});
const isView = v => !!v && !!document.querySelector(`.view[id="${CSS.escape(v)}"]`);
let start = location.hash.slice(1);
if (!isView(start)) { try { start = localStorage.getItem("program-view"); } catch(e){ start = null; } }
show(isView(start) ? start : "day1");
</script>
